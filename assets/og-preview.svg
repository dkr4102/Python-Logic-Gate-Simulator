<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00f2fe" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="250" cy="180" r="180" fill="#00f2fe" opacity="0.08" filter="blur(60px)" />
  <circle cx="950" cy="450" r="220" fill="#10b981" opacity="0.08" filter="blur(70px)" />

  <!-- Title & Subtitles -->
  <text x="100" y="180" fill="#38bdf8" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="4">ONLINE LOGIC GATE SIMULATION</text>
  <text x="100" y="260" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="64" font-weight="800">LogicGate Studio</text>
  <text x="100" y="320" fill="#94a3b8" font-family="'Outfit', system-ui, sans-serif" font-size="26" font-weight="400">Interactive Digital Circuit Simulator &amp; Waveform Logic Analyzer</text>

  <!-- Badges -->
  <g transform="translate(100, 370)">
    <rect width="180" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="90" y="26" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="14" text-anchor="middle" font-weight="600">8 LOGIC GATES</text>

    <rect x="200" width="210" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="305" y="26" fill="#10b981" font-family="'Fira Code', monospace" font-size="14" text-anchor="middle" font-weight="600">LIVE OSCILLOSCOPE</text>

    <rect x="430" width="220" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="540" y="26" fill="#a855f7" font-family="'Fira Code', monospace" font-size="14" text-anchor="middle" font-weight="600">ADDERS &amp; FLIP-FLOPS</text>
  </g>

  <!-- Logic Gate Illustration Graphic on Right -->
  <g transform="translate(820, 200)">
    <!-- Circuit Conduit Lines -->
    <path d="M -100 40 L 0 40" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M -100 120 L 0 120" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 180 80 L 280 80" stroke="#10b981" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="280" cy="80" r="10" fill="#10b981" filter="url(#glow)"/>

    <!-- Gate Body -->
    <path d="M 0 0 L 70 0 C 130 0 180 35 180 80 C 180 125 130 160 70 160 L 0 160 Z"
          fill="#0f172a" stroke="url(#neonCyan)" stroke-width="5" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Internal Core -->
    <circle cx="85" cy="80" r="22" fill="#00f2fe" opacity="0.9" filter="url(#glow)" />
    <text x="85" y="86" fill="#080c14" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="900" text-anchor="middle">AND</text>
  </g>

  <!-- Footer Link -->
  <text x="100" y="540" fill="#64748b" font-family="'Fira Code', monospace" font-size="16">https://logicgate-studio.vercel.app</text>
  <text x="1100" y="540" fill="#64748b" font-family="'Outfit', sans-serif" font-size="16" text-anchor="end">Engineered by Darsh K. Raval</text>
</svg>
